<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>门球计分大屏</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="scoreboard" data-scoreboard>
    <main class="board">
      <div class="board-header">
        <div class="header-info header-left">
          <span data-clock-date></span>
          <span class="weather-chip" data-weather hidden></span>
        </div>
        <h1 class="title" data-title>红星村老年会门球比赛</h1>
        <div class="header-info header-right" data-clock-time></div>
      </div>
      <section class="top">
        <div class="team-total red">
          <div class="team-name" data-red-team>红队</div>
          <div class="total" data-red-total>0</div>
        </div>
        <div class="timer" data-scoreboard-timer>
          <div class="timer-label">剩余时间</div>
          <div class="time" data-time>30:00</div>
          <div class="timer-meta">
            <span data-match>第 1 场</span>
            <span data-status>暂停/待开始</span>
          </div>
        </div>
        <div class="team-total white">
          <div class="total" data-white-total>0</div>
          <div class="team-name" data-white-team>白队</div>
        </div>
      </section>

      <section class="tables">
        <table class="red-table">
          <thead>
            <tr>
              <th data-short="球">球号</th>
              <th data-short="0">0分</th>
              <th data-short="1">1分</th>
              <th data-short="2">2分</th>
              <th data-short="3">3分</th>
              <th data-short="柱">中柱</th>
              <th data-short="分">分数</th>
            </tr>
          </thead>
          <tbody data-red-rows></tbody>
        </table>
        <table class="white-table">
          <thead>
            <tr>
              <th data-short="球">球号</th>
              <th data-short="0">0分</th>
              <th data-short="1">1分</th>
              <th data-short="2">2分</th>
              <th data-short="3">3分</th>
              <th data-short="柱">中柱</th>
              <th data-short="分">分数</th>
            </tr>
          </thead>
          <tbody data-white-rows></tbody>
        </table>
      </section>

      <footer class="footer">
        <div class="recent-log" data-recent-log>
          <div class="log-line"><span class="log-main"><span class="log-time">[30:00]</span> 等待开始</span></div>
        </div>
        <div class="court-name" data-court-name>红星门球场1</div>
      </footer>
    </main>

    <div class="dialog" data-finish-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">结束比赛密码</h2>
        <input class="dialog-input password-code-input finish-password-input" data-finish-password type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6">
        <strong class="dialog-result" data-finish-result></strong>
        <div class="dialog-actions">
          <button class="finish-cancel" data-action="close-finish">再按 * 取消</button>
        </div>
      </div>
    </div>

    <div class="dialog" data-settings-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">设置密码</h2>
        <div class="password-dots" data-settings-password></div>
        <div class="dialog-actions">
          <button class="primary">Enter 确认</button>
          <button data-action="close-settings">再按 / 取消</button>
        </div>
      </div>
    </div>

    <div class="countdown-overlay" data-countdown-overlay aria-hidden="true">
      <div class="countdown-number" data-countdown-number></div>
    </div>

    <button class="sound-enable" data-action="enable-scoreboard-sound" data-sound-enable type="button" hidden>启用声音</button>

    <div class="match-transition" data-match-transition aria-hidden="true">
      <div class="match-transition-shape" data-match-transition-shape></div>
    </div>

    <script src="/app.js?v=20260809-countdown-overlay"></script>
    <script>
      function updateHeaderClock() {
        const now = new Date();
        const dateEl = document.querySelector("[data-clock-date]");
        const timeEl = document.querySelector("[data-clock-time]");
        const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
        const date = `${now.getFullYear()}/${String(now.getMonth() + 1).padStart(2, "0")}/${String(now.getDate()).padStart(2, "0")}(${weekdays[now.getDay()]})`;
        if (dateEl) dateEl.textContent = date;
        if (timeEl) timeEl.textContent = now.toLocaleTimeString("zh-CN", { hour12: false });
      }

      async function updateWeather() {
        const weatherEl = document.querySelector("[data-weather]");
        if (!weatherEl) return;
        try {
          const response = await fetch("/api/weather", { cache: "no-store" });
          const weather = await response.json();
          if (!weather.ok) {
            weatherEl.hidden = true;
            return;
          }
          weatherEl.textContent = `${weather.icon} ${weather.minTempC}/${weather.maxTempC}℃`;
          weatherEl.hidden = false;
        } catch (error) {
          weatherEl.hidden = true;
        }
      }

      updateHeaderClock();
      updateWeather();
      setInterval(updateHeaderClock, 1000);
      setInterval(updateWeather, 30 * 60 * 1000);
    </script>
  </body>
</html>
