<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>门球手机遥控</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="remote-page" data-remote>
    <main class="remote-shell">
      <header class="remote-header">
        <button class="remote-title remote-title-button" type="button" data-action="edit-title-dialog" data-remote-title>红星村老年会门球比赛</button>
        <button class="remote-settings-trigger" type="button" data-action="remote-settings-dialog" aria-label="设置">⚙</button>
      </header>
      <section class="remote-status">
        <button class="remote-status-team red-status-team" data-action="edit-team-dialog" data-team="red">
          <span data-remote-status-red-team>红队</span>
        </button>
        <span class="remote-status-time">
          <span data-remote-state>暂停/待开始</span>
          <span data-remote-time>30:00</span>
        </span>
        <button class="remote-status-team white-status-team" data-action="edit-team-dialog" data-team="white">
          <span data-remote-status-white-team>白队</span>
        </button>
      </section>

      <section class="remote-board">
        <div class="ball-column">
          <button class="red-ball" data-action="select" data-ball="1"><span class="ball-number">1</span><span class="ball-score-badge">0</span></button>
          <button class="red-ball" data-action="select" data-ball="3"><span class="ball-number">3</span><span class="ball-score-badge">0</span></button>
          <button class="red-ball" data-action="select" data-ball="5"><span class="ball-number">5</span><span class="ball-score-badge">0</span></button>
          <button class="red-ball" data-action="select" data-ball="7"><span class="ball-number">7</span><span class="ball-score-badge">0</span></button>
          <button class="red-ball" data-action="select" data-ball="9"><span class="ball-number">9</span><span class="ball-score-badge">0</span></button>
        </div>
        <div class="remote-score-panel">
          <div class="remote-total-scoreline" aria-label="比分">
            <strong class="red-total-mobile" data-remote-red-total>0</strong>
            <span>:</span>
            <strong class="white-total-mobile" data-remote-white-total>0</strong>
          </div>
          <button class="timer-action" data-action="toggle_timer">开始</button>
          <button class="music-action compact" data-action="toggle_music" aria-label="播放音乐" title="播放音乐"><span class="music-note">♪</span></button>
        </div>
        <div class="ball-column">
          <button class="white-ball" data-action="select" data-ball="2"><span class="ball-number">2</span><span class="ball-score-badge">0</span></button>
          <button class="white-ball" data-action="select" data-ball="4"><span class="ball-number">4</span><span class="ball-score-badge">0</span></button>
          <button class="white-ball" data-action="select" data-ball="6"><span class="ball-number">6</span><span class="ball-score-badge">0</span></button>
          <button class="white-ball" data-action="select" data-ball="8"><span class="ball-number">8</span><span class="ball-score-badge">0</span></button>
          <button class="white-ball" data-action="select" data-ball="10"><span class="ball-number">10</span><span class="ball-score-badge">0</span></button>
        </div>
      </section>

      <section class="remote-actions">
        <button class="undo-action" data-action="undo">↩️ - 撤销</button>
        <button class="score-action" data-action="advance">✅ + 得分</button>
        <button class="swap-team-action" data-action="swap_team_names">🔴⇄⚪ 换队名</button>
        <button class="countdown-action compact" data-action="ten-second-countdown">⏰ 10秒倒计时</button>
        <div class="finish-results-row">
          <button class="danger" data-action="finish-dialog">🏆 结束比赛</button>
          <a class="results-link" href="/results">📊 成绩</a>
        </div>
      </section>
      <section class="remote-recent-log recent-log" data-remote-recent-log>
        <div class="log-line"><span class="log-main"><span class="log-time">[30:00]</span> 等待开始</span></div>
      </section>
    </main>

    <div class="dialog" data-finish-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">结束比赛密码</h2>
        <input class="dialog-input password-code-input finish-password-input" data-finish-password type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6">
        <strong class="dialog-result" data-finish-result></strong>
        <div class="dialog-actions">
          <button class="finish-cancel" data-action="close-finish">取消</button>
        </div>
      </div>
    </div>

    <div class="dialog" data-swap-team-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">更换红白队名</h2>
        <div class="dialog-actions">
          <button class="finish-confirm" data-action="confirm-swap-team">确定</button>
          <button class="finish-cancel" data-action="close-swap-team">取消</button>
        </div>
      </div>
    </div>

    <div class="dialog" data-edit-team-dialog>
      <form class="dialog-box" data-edit-team-form>
        <h2 class="dialog-title" data-edit-team-title>修改队名</h2>
        <input class="dialog-input" name="teamName" data-edit-team-input autocomplete="off" maxlength="24">
        <div class="dialog-actions">
          <button class="finish-confirm" type="submit">保存</button>
          <button class="finish-cancel" type="button" data-action="close-edit-team">取消</button>
        </div>
      </form>
    </div>

    <div class="dialog" data-edit-title-dialog>
      <form class="dialog-box" data-edit-title-form>
        <h2 class="dialog-title">修改比赛标题</h2>
        <input class="dialog-input" name="matchTitle" data-edit-title-input autocomplete="off" maxlength="40">
        <div class="dialog-actions">
          <button class="finish-confirm" type="submit">保存</button>
          <button class="finish-cancel" type="button" data-action="close-edit-title">取消</button>
        </div>
      </form>
    </div>

    <div class="dialog" data-remote-settings-dialog>
      <div class="dialog-box remote-settings-box">
        <div class="settings-modal-head">
          <h2 class="dialog-title">设置</h2>
          <button class="settings-close" type="button" data-action="close-remote-settings" aria-label="关闭">×</button>
        </div>
        <div class="settings-tabs">
          <button class="settings-tab active" type="button" data-action="settings-tab" data-settings-tab="general">常规</button>
          <button class="settings-tab" type="button" data-action="settings-tab" data-settings-tab="music">背景音乐</button>
          <button class="settings-tab" type="button" data-action="settings-tab" data-settings-tab="rf">遥控器</button>
          <button class="settings-tab" type="button" data-action="settings-tab" data-settings-tab="network">网络</button>
        </div>
        <section class="settings-tab-panel active" data-settings-panel="general">
          <form class="settings-form" data-settings-form>
            <label>
              比赛时长（分钟）
              <input name="durationMinutes" type="number" min="1" max="120">
            </label>
            <label>
              播报声音
              <select name="voiceProfile">
                <option value="female">中文女声</option>
                <option value="male">中文男声</option>
                <option value="ko-female">韩语女声</option>
                <option value="ko-male">韩语男声</option>
              </select>
            </label>
            <label>
              播报速度
              <div class="range-control">
                <input name="voicePlaybackRate" type="range" min="0.8" max="2.0" step="0.1">
                <output data-voice-playback-rate-output>1.2x</output>
              </div>
            </label>
            <label>
              系统音量
              <div class="range-control volume-control">
                <input name="systemVolumePercent" type="range" min="0" max="100" step="5">
                <output data-system-volume-output>100%</output>
                <div class="volume-buttons">
                  <button class="secondary" type="button" data-action="system-volume-down">-</button>
                  <button class="secondary" type="button" data-action="system-volume-up">+</button>
                  <button class="secondary" type="button" data-action="test-system-volume">测试音量</button>
                </div>
              </div>
            </label>
            <div class="title-style-control">
              <label>
                比赛标题颜色
                <div class="color-control">
                  <input name="titleColor" type="color" value="#ffe23a">
                  <button class="secondary" type="button" data-action="reset-title-color">恢复默认</button>
                </div>
              </label>
              <label>
                比赛标题大小
                <div class="stepper-control">
                  <button class="secondary" type="button" data-action="title-size-down">减小</button>
                  <output data-title-font-scale-output>100%</output>
                  <button class="secondary" type="button" data-action="title-size-up">放大</button>
                </div>
                <input name="titleFontScale" type="hidden" value="1.00">
              </label>
            </div>
            <label class="check">
              <input name="tableMarkerAutoSize" type="checkbox">
              球号/球标大小自动
            </label>
            <label>
              球号/球标大小
              <div class="stepper-control">
                <button class="secondary" type="button" data-action="table-marker-size-down">减小</button>
                <output data-table-marker-scale-output>100%</output>
                <button class="secondary" type="button" data-action="table-marker-size-up">放大</button>
              </div>
              <input name="tableMarkerScale" type="hidden" value="1.00">
            </label>
            <label>
              天气位置
              <input name="weatherLocation" data-weather-location-input autocomplete="off" placeholder="输入城市搜索，留空自动定位">
              <input name="weatherLatitude" type="hidden">
              <input name="weatherLongitude" type="hidden">
              <div class="weather-search-results" data-weather-search-results></div>
            </label>
            <label class="check">
              <input name="allowScoringWhenPaused" type="checkbox">
              暂停期间允许计分
            </label>
            <label>
              新结束密码
              <input name="finishPassword" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="不改请留空">
            </label>
            <label>
              新设置密码
              <input name="settingsPassword" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="不改请留空">
            </label>
            <button class="primary" type="submit">保存设置</button>
            <strong data-save-result></strong>
          </form>
        </section>

        <section class="settings-tab-panel" data-settings-panel="music">
          <form class="settings-form music-settings-form" data-settings-form>
            <fieldset class="music-settings-panel">
              <legend>背景音乐</legend>
              <label class="check">
                <input name="musicEnabled" type="checkbox">
                启用背景音乐
              </label>
              <label>
                音乐文件
                <div class="music-file-control">
                  <select name="selectedMusicTrack">
                    <option value="">正在读取音乐...</option>
                  </select>
                  <button class="music-delete-button" type="button" data-action="delete-music-item" aria-label="删除当前音乐或目录" title="删除当前音乐或目录">🗑</button>
                </div>
              </label>
              <label>
                播放模式
                <select name="musicMode">
                  <option value="loop">单曲循环</option>
                  <option value="sequence">顺序播放</option>
                  <option value="random">随机播放</option>
                </select>
              </label>
              <label>
                音乐音量
                <div class="range-control">
                  <input name="musicVolumePercent" type="range" min="0" max="100" step="5">
                  <output data-music-volume-output>35%</output>
                </div>
              </label>
              <label class="check">
                <input name="musicAutoPlayDuringMatch" type="checkbox">
                比赛开始自动播放
              </label>
              <label class="check">
                <input name="musicStopWhenMatchEnds" type="checkbox">
                比赛结束自动停止
              </label>
              <label class="check">
                <input name="musicDuckDuringSpeech" type="checkbox">
                播报时压低音乐
              </label>
              <label>
                播报时压低到
                <div class="range-control">
                  <input name="musicDuckPercent" type="range" min="10" max="80" step="5">
                  <output data-music-duck-output>30%</output>
                </div>
              </label>
              <button class="secondary" type="button" data-action="test-music">测试播放</button>
            </fieldset>
            <button class="primary" type="submit">保存背景音乐设置</button>
            <strong data-music-save-result></strong>
          </form>
        </section>

        <section class="settings-tab-panel" data-settings-panel="rf">
          <div class="rf-panel" data-rf-panel>
            <h3>射频遥控器</h3>
            <div class="rf-layout" data-rf-layout></div>
          </div>
        </section>
        <section class="settings-tab-panel" data-settings-panel="network">
          <div class="network-panel">
            <div class="network-status" data-network-status>正在读取网络状态...</div>
            <form class="settings-form" data-network-settings-form>
              <label>
                球场名称/热点名称
                <input name="courtName" autocomplete="off" maxlength="24">
              </label>
              <label>
                热点密码
                <input name="hotspotPassword" autocomplete="off" minlength="8" maxlength="63">
              </label>
              <button class="primary" type="submit">保存热点设置</button>
              <strong data-network-save-result></strong>
            </form>
            <div class="wifi-connect-panel">
              <button class="secondary" type="button" data-action="scan-wifi">查找 WiFi 网络</button>
              <div class="wifi-list" data-wifi-list></div>
              <label>
                选择的 WiFi
                <input name="wifiSsid" data-wifi-ssid readonly>
              </label>
              <label>
                WiFi 密码
                <input name="wifiPassword" data-wifi-password autocomplete="off">
              </label>
              <button class="primary" type="button" data-action="connect-wifi">连接 WiFi</button>
              <strong data-network-result></strong>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="dialog" data-settings-save-password-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">输入设置密码</h2>
        <input class="dialog-input password-code-input" data-settings-save-password-input type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6">
        <strong class="dialog-result" data-settings-save-password-result></strong>
        <div class="dialog-actions">
          <button class="finish-cancel" type="button" data-action="close-settings-save-password">取消</button>
        </div>
      </div>
    </div>

    <div class="countdown-overlay" data-countdown-overlay aria-hidden="true">
      <div class="countdown-number" data-countdown-number></div>
    </div>
    <div class="match-transition" data-match-transition aria-hidden="true">
      <div class="match-transition-shape" data-match-transition-shape></div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
