<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>门球手机遥控</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="remote-page" data-remote>
    <main class="remote-shell">
      <h1 class="remote-title" data-remote-title>红星村老年会门球比赛</h1>
      <section class="remote-status">
        <span>剩余时间：<span data-remote-time>30:00</span></span>
      </section>

      <section class="remote-board">
        <div class="ball-column">
          <button class="red-ball" data-action="select" data-ball="1"><span>1</span></button>
          <button class="red-ball" data-action="select" data-ball="3"><span>3</span></button>
          <button class="red-ball" data-action="select" data-ball="5"><span>5</span></button>
          <button class="red-ball" data-action="select" data-ball="7"><span>7</span></button>
          <button class="red-ball" data-action="select" data-ball="9"><span>9</span></button>
        </div>
        <div class="remote-score-panel">
          <div class="remote-total red-total-mobile">
            <span data-remote-red-team>红队</span>
            <strong data-remote-red-total>0</strong>
          </div>
          <div class="remote-total white-total-mobile">
            <strong data-remote-white-total>0</strong>
            <span data-remote-white-team>白队</span>
          </div>
          <button class="timer-action" data-action="toggle_timer">开始</button>
        </div>
        <div class="ball-column">
          <button class="white-ball" data-action="select" data-ball="2"><span>2</span></button>
          <button class="white-ball" data-action="select" data-ball="4"><span>4</span></button>
          <button class="white-ball" data-action="select" data-ball="6"><span>6</span></button>
          <button class="white-ball" data-action="select" data-ball="8"><span>8</span></button>
          <button class="white-ball" data-action="select" data-ball="10"><span>10</span></button>
        </div>
      </section>

      <section class="remote-actions">
        <button class="undo-action" data-action="undo">- 撤销</button>
        <button class="score-action" data-action="advance">得分</button>
        <button class="wide danger" data-action="finish-dialog">结束比赛</button>
      </section>
    </main>

    <div class="dialog" data-finish-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">结束比赛密码</h2>
        <div class="password-dots" data-finish-password></div>
        <div class="dialog-actions">
          <button class="finish-confirm" data-action="confirm-finish">确认</button>
          <button class="finish-cancel" data-action="close-finish">取消</button>
        </div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
