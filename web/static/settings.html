<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>门球设置</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="settings-page">
    <main class="settings-shell">
      <h1 class="settings-title">门球设置</h1>
      <form class="settings-form" data-settings-form>
        <label>
          比赛标题
          <input name="title" autocomplete="off">
        </label>
        <label>
          比赛时长（分钟）
          <input name="durationMinutes" type="number" min="1" max="120">
        </label>
        <label>
          播报声音
          <select name="voiceProfile">
            <option value="female">女声</option>
            <option value="male">男声</option>
          </select>
        </label>
        <label>
          天气位置
          <input name="weatherLocation" data-weather-location-input autocomplete="off" placeholder="输入城市搜索，留空自动定位">
          <input name="weatherLatitude" type="hidden">
          <input name="weatherLongitude" type="hidden">
          <div class="weather-search-results" data-weather-search-results></div>
        </label>
        <label class="check">
          <input name="allowScoringWhenPaused" type="checkbox">
          暂停期间允许计分
        </label>
        <label>
          新结束密码
          <input name="finishPassword" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="不改请留空">
        </label>
        <label>
          新设置密码
          <input name="settingsPassword" type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6" placeholder="不改请留空">
        </label>
        <button class="primary" type="submit">保存设置</button>
        <strong data-save-result></strong>
      </form>
      <section class="key-binding-panel">
        <h2>按键映射</h2>
        <div class="key-binding-head">
          <span>名称</span>
          <span>按键</span>
        </div>
        <div class="key-binding-list" data-key-binding-list></div>
      </section>
    </main>
    <div class="dialog" data-settings-save-password-dialog>
      <div class="dialog-box">
        <h2 class="dialog-title">输入设置密码</h2>
        <input class="dialog-input" data-settings-save-password-input type="tel" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="6">
        <strong class="dialog-result" data-settings-save-password-result></strong>
        <div class="dialog-actions">
          <button class="finish-cancel" type="button" data-action="close-settings-save-password">取消</button>
        </div>
      </div>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
